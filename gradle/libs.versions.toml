[versions]
# SDK targets — confirmed against PROJECT_BRIEF.md (minSdk=26, targetSdk=36)
minSdk            = "26"
compileSdk        = "36"
targetSdk         = "36"

# Build toolchain
agp               = "8.11.0"
kotlin            = "2.1.20"
ksp               = "2.1.20-1.0.32"

# AndroidX / Compose
composeBom        = "2026.09.00"
activityCompose   = "1.10.1"
coreKtx           = "1.16.0"
lifecycleRuntime  = "2.9.1"
navigationCompose = "2.9.0"

# DI
hilt              = "2.56"
hiltNav           = "1.3.0"

# Storage
room              = "2.8.5"
datastore         = "1.1.3"

# Background
workmanager       = "2.12.0"

# Images + Charts
coil              = "3.6.3"
vico              = "2.1.2"

# Firebase BoM
firebaseBom       = "34.0.0"

# Quality
detekt            = "1.23.8"
leakcanary        = "2.14"
junit             = "4.13.2"
mockk             = "1.14.2"
turbine           = "1.2.0"
coroutines        = "1.10.2"
coroutinesTest    = "1.10.2"
androidxTestCore  = "1.7.0"
androidxTestExt   = "1.3.0"
androidxEspresso  = "3.7.0"
androidxTestRunner= "1.7.0"
desugar           = "2.1.4"

[libraries]
# --- Core Android ---
androidx-core-ktx               = { module = "androidx.core:core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",  version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-ktx= { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
androidx-activity-compose       = { module = "androidx.activity:activity-compose",          version.ref = "activityCompose" }
android-desugar                 = { module = "com.android.tools:desugar_jdk_libs",          version.ref = "desugar" }
kotlinx-coroutines-core         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Compose BOM (controls all androidx.compose.* versions) ---
androidx-compose-bom            = { module = "androidx.compose:compose-bom",               version.ref = "composeBom" }
androidx-compose-ui             = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics    = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3      = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

# --- Navigation Compose (stable 2.x, not Nav3 alpha) ---
androidx-navigation-compose     = { module = "androidx.navigation:navigation-compose",     version.ref = "navigationCompose" }

# --- Hilt ---
hilt-android                    = { module = "com.google.dagger:hilt-android",             version.ref = "hilt" }
hilt-compiler                   = { module = "com.google.dagger:hilt-compiler",            version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose",    version.ref = "hiltNav" }

# --- Room ---
androidx-room-runtime           = { module = "androidx.room:room-runtime",                 version.ref = "room" }
androidx-room-ktx               = { module = "androidx.room:room-ktx",                    version.ref = "room" }
androidx-room-compiler          = { module = "androidx.room:room-compiler",                version.ref = "room" }

# --- DataStore ---
androidx-datastore-preferences  = { module = "androidx.datastore:datastore-preferences",   version.ref = "datastore" }

# --- WorkManager ---
androidx-work-runtime-ktx       = { module = "androidx.work:work-runtime-ktx",             version.ref = "workmanager" }

# --- Images ---
coil-compose                    = { module = "io.coil-kt.coil3:coil-compose",              version.ref = "coil" }
coil-network-okhttp             = { module = "io.coil-kt.coil3:coil-network-okhttp",       version.ref = "coil" }

# --- Charts ---
vico-compose-m3                 = { module = "com.patrykandpatrick.vico:compose-m3",       version.ref = "vico" }

# --- Firebase (versions managed by BoM) ---
firebase-bom                    = { module = "com.google.firebase:firebase-bom",           version.ref = "firebaseBom" }
firebase-analytics              = { module = "com.google.firebase:firebase-analytics" }
firebase-auth                   = { module = "com.google.firebase:firebase-auth" }
firebase-firestore              = { module = "com.google.firebase:firebase-firestore" }
firebase-database               = { module = "com.google.firebase:firebase-database" }
firebase-messaging              = { module = "com.google.firebase:firebase-messaging" }
firebase-remoteconfig           = { module = "com.google.firebase:firebase-config" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-crashlytics            = { module = "com.google.firebase:firebase-crashlytics" }
firebase-perf                   = { module = "com.google.firebase:firebase-perf" }

# --- Quality / Debug ---
leakcanary                      = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# --- Testing ---
junit                           = { module = "junit:junit",                                 version.ref = "junit" }
mockk                           = { module = "io.mockk:mockk",                             version.ref = "mockk" }
turbine                         = { module = "app.cash.turbine:turbine",                    version.ref = "turbine" }
kotlinx-coroutines-test         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-test-core              = { module = "androidx.test:core",                          version.ref = "androidxTestCore" }
androidx-test-ext-junit         = { module = "androidx.test.ext:junit",                     version.ref = "androidxTestExt" }
androidx-test-runner            = { module = "androidx.test:runner",                        version.ref = "androidxTestRunner" }
androidx-test-espresso-core     = { module = "androidx.test.espresso:espresso-core",        version.ref = "androidxEspresso" }

[plugins]
android-application             = { id = "com.android.application",                        version.ref = "agp" }
android-library                 = { id = "com.android.library",                            version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",                   version.ref = "kotlin" }
kotlin-compose-compiler         = { id = "org.jetbrains.kotlin.plugin.compose",            version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin" }
hilt                            = { id = "com.google.dagger.hilt.android",                 version.ref = "hilt" }
ksp                             = { id = "com.google.devtools.ksp",                        version.ref = "ksp" }
google-services                 = { id = "com.google.gms.google-services",                 version = "4.5.0" }
firebase-crashlytics            = { id = "com.google.firebase.crashlytics",                version = "3.0.4" }
firebase-perf                   = { id = "com.google.firebase.firebase-perf",              version = "1.4.2" }
detekt                          = { id = "io.gitlab.arturbosch.detekt",                    version.ref = "detekt" }